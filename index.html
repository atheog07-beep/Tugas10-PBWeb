<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biodata</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <table id="tabel">
        <!--judulnya -->
        <tr>
          <td>
            <h1 id="judul">BIODATA</h1>
            <hr />
          </td>
        </tr>
        <!--data diri -->
        <tr>
          <td>
            <table class="isian">
              <tr>
                <td><label for="nama">Nama :</label></td>
                <td>
                  <input
                    type="text"
                    id="nama"
                    name="nama"
                    minlength="3"
                    placeholder="Minimal 3 karakter"
                    required
                  />
                </td>
              </tr>
              <tr>
                <td><label for="password">Password :</label></td>
                <td>
                  <input
                    type="password"
                    id="password"
                    name="password"
                    minlength="8"
                    placeholder="Minimal 8 karakter"
                    required
                  />
                </td>
              </tr>
              <tr>
                <td><b>Jenis kelamin</b>:</td>
                <td>
                  <input type="radio" id="laki-laki" name="jenisKelamin" required/>
                  <label for="laki-laki">L</label>
                  <input type="radio" id="perempuan" name="jenisKelamin" required/>
                  <label for="perempuan">P</label>
                </td>
              </tr>
              <tr>
                <td>
                  <i><u>Status perkawinan:</u></i>
                </td>
                <td>
                  <input type="checkbox" id="menikah" name="status" />
                  <label for="menikah">Menikah</label>
                  <input type="checkbox" id="anak" name="status" />
                  <label for="anak">Punya anak</label>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!--hobi, penghasilan,tombol-->
        <tr>
          <td>
            <label for="hobby">Hobi:</label><br />
            <textarea
              id="hobby"
              name="hobby"
              minlength="5"
              placeholder="minimal 5 karakter"
              required
            ></textarea>
            <br />
            <div class="baris-penghasilan">
              <label for="penghasilan">Penghasilan:</label>
              <select required
                id="penghasilan"
                name="penghasilan"
                class="pilihan">
              <option value="" disabled selected>Penghasilan/bulan: </option>
            </select>
            </div>
            <button type="submit" id="kirim">Kirim</button>
          </td>
        </tr>
      </table>
    </form>
    <script src="script.js"></script>
  </body>
</html>
